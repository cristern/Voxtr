workflows:

  # =======================================================================
  # 1. package-tests — runs the native VoxtrSprint0Tests unit test target
  #    via the dedicated VoxtrTests scheme, against a concrete simulator
  #    destination (xcodebuild test cannot run against a generic
  #    destination). The simulator device is AUTO-DETECTED from
  #    `xcodebuild -showdestinations` rather than hardcoded — a hardcoded
  #    device name (e.g. "iPhone 16") breaks the moment Apple's simulator
  #    lineup moves on to a newer generation on the CI image, which is
  #    exactly what happened here. Produces a REAL .xcresult and converts
  #    it to JUnit with Scripts/xcresult_to_junit.py — not xcpretty. The
  #    workflow hard-fails if zero tests execute, if no destination can
  #    be auto-detected, or if the result bundle/JUnit conversion can't
  #    be produced at all — it never falls back to an empty passing report.
  # =======================================================================
  package-tests:
    name: Voxtr — Package unit tests (Swift Testing)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        XCODE_SCHEME: "VoxtrTests"
        ATHLETE_SCHEME: "AthleteApp"
        RESULT_BUNDLE: "build/reports/VoxtrSprint0Tests.xcresult"
        JUNIT_OUTPUT: "build/reports/junit.xml"
        KEYCHAIN_RESULT_BUNDLE: "build/reports/VoxtrSprint0TestsKeychain.xcresult"
        KEYCHAIN_JUNIT_OUTPUT: "build/reports/junit-keychain.xml"
    triggering:
      events:
        - push
      # Automatic trigger: push to develop ONLY. Pull-request validation
      # is handled entirely by the separate pr-validation workflow now
      # (CI-01) — this workflow no longer reacts to pull requests at all.
      branch_patterns:
        - pattern: "*"
          include: false
        - pattern: develop
          include: true
      cancel_previous_builds: true
    # CI-01: skip when only documentation changed. Per Codemagic's own
    # docs, the build after first adding this "when" block still runs
    # once regardless of changeset (needed to establish the baseline);
    # only builds AFTER that are actually skipped when the changeset
    # matches only the excluded paths.
    when:
      changeset:
        excludes:
          - "**/*.md"
    scripts:
      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies all are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          echo "== Bundle identifiers =="
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            | grep -i PRODUCT_BUNDLE_IDENTIFIER || true

      - name: Auto-detect an available iOS Simulator via simctl (more reliable than scheme-filtered -showdestinations, which returned no concrete simulators for this scheme)
        script: |
          set -e
          mkdir -p build/reports
          echo "== Informational: xcodebuild -showdestinations (may be incomplete for a test-only scheme) =="
          xcodebuild -showdestinations -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            > build/reports/destinations.txt 2>&1 || true
          cat build/reports/destinations.txt
          echo "== Querying simctl directly for an available iPhone simulator (source of truth) =="
          SIMULATOR_UDID=$(python3 Scripts/pick_simulator.py)
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "FAILING BUILD: simctl reports no available iPhone simulator on this CI image at all — see the stderr output above for the full device list. This needs a human to look at what's actually installed, not another guess from me."
            exit 1
          fi
          echo "Auto-detected simulator UDID: $SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$CM_ENV"

      - name: Print discovered tests before running (best effort — see script comments if this step's flags don't match your Xcode version)
        script: |
          set +e
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -enumerate-tests \
            -test-enumeration-format json \
            -test-enumeration-output-path build/reports/discovered-tests.json \
            CODE_SIGNING_ALLOWED=NO
          if [ -f build/reports/discovered-tests.json ]; then
            echo "== Discovered tests =="
            cat build/reports/discovered-tests.json
          else
            echo "NOTE: -enumerate-tests did not produce output on this Xcode version/image — this is a best-effort visibility step and is NOT what gates pass/fail below. Continuing."
          fi
          set -e

      - name: Build AthleteApp as a Keychain-capable test host for VoxtrSprint0Tests (plain app build, ad hoc signed, same fixed derived-data path — NOT the standalone compile-check build elsewhere in this workflow)
        script: |
          set -eo pipefail
          DIAG_DD="$(pwd)/build/DiagDerivedData"
          rm -rf "$DIAG_DD"
          mkdir -p build/reports
          # Build #232 artifacts (PR #116 R3) established via the actual
          # .xctestrun that VoxtrSprint0Tests, with no TEST_HOST, runs
          # inside the standalone iPhoneSimulator-platform `xctest`
          # agent — not any application. The ad-hoc-signed .xctest
          # bundle's own entitlements dump empty, so signing the
          # *bundle* alone cannot fix real Keychain access (already
          # tried and confirmed insufficient); the agent's own
          # entitlements were never directly inspected, so this does
          # not claim they are proven absent too. The attempted fix is
          # an application-hosted execution path: build AthleteApp
          # here as the TEST_HOST, ad hoc signed exactly like the test
          # bundle, reusing its own already-existing entitlements
          # configuration (AthleteApp/AthleteApp.entitlements) — no new
          # team identifier invented, Apple's own xctest binary
          # untouched. TEST_HOST/BUNDLE_LOADER are set on the
          # VoxtrSprint0Tests target in project.pbxproj (not as a
          # global xcodebuild override here — build #234 showed that
          # leaks into every SwiftPM dependency target's link command
          # and breaks their relocatable (-r) link step). Build #234
          # also found AthleteApp's own ad-hoc-signed entitlements dump
          # as an empty dict — this build step alone does not prove
          # AthleteApp is actually Keychain-capable; the diagnostic step
          # below inspects its real codesign output, and the real test
          # result is the only real evidence either way.
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$ATHLETE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$DIAG_DD" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/reports/athlete-app-test-host-build.log
          ATHLETE_APP_BUNDLE=$(find "$DIAG_DD/Build/Products" -iname "AthleteApp.app" | head -n1)
          if [ -z "$ATHLETE_APP_BUNDLE" ]; then
            echo "FAILING BUILD: AthleteApp.app not found under $DIAG_DD/Build/Products after building it as the Keychain test host for VoxtrSprint0Tests — see athlete-app-test-host-build.log."
            exit 1
          fi
          TEST_HOST_PATH="$ATHLETE_APP_BUNDLE/AthleteApp"
          if [ ! -f "$TEST_HOST_PATH" ]; then
            echo "FAILING BUILD: resolved AthleteApp.app but its executable is missing at $TEST_HOST_PATH"
            exit 1
          fi
          echo "Resolved TEST_HOST_PATH=$TEST_HOST_PATH"
          echo "TEST_HOST_PATH=$TEST_HOST_PATH" >> "$CM_ENV"

      - name: Diagnose VoxtrSprint0Tests signing/entitlements (AthleteApp test host, fixed derived-data path, real evidence; read-only, never fails the build)
        script: |
          set +e
          DIAG_DD="$(pwd)/build/DiagDerivedData"
          echo "== FULL (unfiltered) effective build settings for VoxtrTests scheme (ad hoc signing + AthleteApp TEST_HOST applied) =="
          xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$DIAG_DD" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            > build/reports/signing-diagnostic-build-settings.log 2>&1
          echo "xcodebuild -showBuildSettings exit code: $?" | tee -a build/reports/signing-diagnostic-build-settings.log
          echo "== Building VoxtrSprint0Tests for testing, hosted inside AthleteApp at $TEST_HOST_PATH, same fixed derived-data path the real test step below now also uses =="
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$DIAG_DD" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            > build/reports/build-for-testing-diagnostic.log 2>&1
          BUILD_FOR_TESTING_EXIT=$?
          echo "xcodebuild build-for-testing exit code: $BUILD_FOR_TESTING_EXIT" | tee -a build/reports/build-for-testing-diagnostic.log
          echo "== Locating .xctestrun files — the definitive declaration of the actual test host/runner, not an inferred one =="
          find "$DIAG_DD" -iname "*.xctestrun" \
            > build/reports/signing-diagnostic-found-xctestrun.txt \
            2> build/reports/signing-diagnostic-found-xctestrun.stderr
          echo "-- find stdout (candidate paths, one per line) --"
          cat build/reports/signing-diagnostic-found-xctestrun.txt
          echo "-- find stderr (errors only — NOT candidate paths) --"
          cat build/reports/signing-diagnostic-found-xctestrun.stderr
          : > build/reports/signing-diagnostic-xctestrun-dump.log
          while IFS= read -r runfile; do
            [ -f "$runfile" ] || { echo "SKIPPING non-existent path from find output: $runfile" | tee -a build/reports/signing-diagnostic-xctestrun-dump.log; continue; }
            echo "--- $runfile ---" | tee -a build/reports/signing-diagnostic-xctestrun-dump.log
            /usr/libexec/PlistBuddy -c "Print" "$runfile" 2>&1 | tee -a build/reports/signing-diagnostic-xctestrun-dump.log
          done < build/reports/signing-diagnostic-found-xctestrun.txt
          echo "== Enumerating every .xctest/.app bundle under the fixed derived-data Products directory =="
          find "$DIAG_DD/Build/Products" \( -iname "*.xctest" -o -iname "*.app" \) \
            > build/reports/signing-diagnostic-found-bundles.txt \
            2> build/reports/signing-diagnostic-found-bundles.stderr
          echo "-- find stdout (candidate paths, one per line) --"
          cat build/reports/signing-diagnostic-found-bundles.txt
          echo "-- find stderr (errors only — NOT candidate paths; e.g. Products dir missing) --"
          cat build/reports/signing-diagnostic-found-bundles.stderr
          # Only lines that are real, existing paths count as "found" — find's own
          # stderr (e.g. "No such file or directory") goes to a SEPARATE file above
          # specifically so it can never be mistaken for a discovered bundle path.
          : > build/reports/signing-diagnostic-valid-bundles.txt
          while IFS= read -r bundle; do
            [ -e "$bundle" ] && echo "$bundle" >> build/reports/signing-diagnostic-valid-bundles.txt
          done < build/reports/signing-diagnostic-found-bundles.txt
          : > build/reports/signing-diagnostic-entitlements.log
          if [ ! -s build/reports/signing-diagnostic-valid-bundles.txt ]; then
            echo "INCOMPLETE COLLECTION: no real .xctest/.app bundle path found under $DIAG_DD/Build/Products (build-for-testing exit was $BUILD_FOR_TESTING_EXIT — see build-for-testing-diagnostic.log and signing-diagnostic-found-bundles.stderr for why). This is NOT entitlement evidence — it means collection itself did not find anything to inspect." \
              | tee build/reports/signing-diagnostic-entitlements.log
          else
            while IFS= read -r bundle; do
              echo "--- entitlements: $bundle ---" | tee -a build/reports/signing-diagnostic-entitlements.log
              codesign -d --entitlements :- "$bundle" 2>&1 | tee -a build/reports/signing-diagnostic-entitlements.log
              echo "--- codesign -dvvv: $bundle ---" | tee -a build/reports/signing-diagnostic-entitlements.log
              codesign -dvvv "$bundle" 2>&1 | tee -a build/reports/signing-diagnostic-entitlements.log
            done < build/reports/signing-diagnostic-valid-bundles.txt
          fi
          echo "== Also inspecting the resolved TEST_HOST executable directly — the ACTUAL host this run declares via TEST_HOST/BUNDLE_LOADER, cross-checked against the .xctestrun TestHostPath dump above, not a disconnected xcrun guess =="
          echo "TEST_HOST_PATH=$TEST_HOST_PATH" | tee -a build/reports/signing-diagnostic-entitlements.log
          if [ -f "$TEST_HOST_PATH" ]; then
            echo "--- entitlements: $TEST_HOST_PATH ---" | tee -a build/reports/signing-diagnostic-entitlements.log
            codesign -d --entitlements :- "$TEST_HOST_PATH" 2>&1 | tee -a build/reports/signing-diagnostic-entitlements.log
            echo "--- codesign -dvvv: $TEST_HOST_PATH ---" | tee -a build/reports/signing-diagnostic-entitlements.log
            codesign -dvvv "$TEST_HOST_PATH" 2>&1 | tee -a build/reports/signing-diagnostic-entitlements.log
          else
            echo "TEST_HOST_PATH does not exist as a file: $TEST_HOST_PATH" | tee -a build/reports/signing-diagnostic-entitlements.log
          fi
          exit 0

      - name: Run VoxtrSprint0Tests main suite (previously-working standalone environment — excludes the real-Keychain round-trip test, isolated in a separate hosted step below)
        script: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE"
          # R3 status (PR #116 review thread): build #236 confirmed
          # TEST_HOST=AthleteApp (set in project.pbxproj) makes the real
          # Keychain round-trip test
          # (AthleteDeviceAuthorizationSessionManagerTests
          # .keychainStoreRoundTrips) genuinely pass — the original
          # errSecMissingEntitlement (-34018) symptom is fixed by
          # application-hosted execution. But hosting the ENTIRE
          # 903-test suite inside AthleteApp's process changes its
          # persistence/CloudKit environment: build #236's actual log
          # showed repeated harness restarts and hundreds of
          # SwiftData/CloudKit model-container failures
          # (NSCocoaErrorDomain 134060, "CloudKit integration requires
          # that all attributes be optional...") — a regression from
          # running every domain/persistence test inside one shared app
          # process with AthleteApp's own production CloudKit-backed
          # SwiftData container, not anything to do with Keychain access.
          # Not a reason to touch any production model or CloudKit
          # configuration. This step restores the previously-working
          # standalone (no TEST_HOST) execution for every test except
          # the one that actually needs a Keychain-capable host,
          # explicitly clearing TEST_HOST/BUNDLE_LOADER back to empty on
          # the command line for this one invocation only — the isolated
          # Keychain step below keeps project.pbxproj's default.
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$(pwd)/build/DiagDerivedData" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -skip-testing:VoxtrSprint0Tests/AthleteDeviceAuthorizationSessionManagerTests/keychainStoreRoundTrips() \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            TEST_HOST= \
            BUNDLE_LOADER= \
            2>&1 | tee build/reports/xcodebuild-test.log

      - name: Run the real Keychain round-trip test hosted inside AthleteApp (isolated — build #236 confirmed this exact test passes genuinely; running it alongside the full suite in the same app process caused the unrelated SwiftData/CloudKit regression above)
        script: |
          set -o pipefail
          rm -rf "$KEYCHAIN_RESULT_BUNDLE"
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$(pwd)/build/DiagDerivedData" \
            -resultBundlePath "$KEYCHAIN_RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -only-testing:VoxtrSprint0Tests/AthleteDeviceAuthorizationSessionManagerTests/keychainStoreRoundTrips() \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/reports/xcodebuild-test-keychain.log

      - name: Convert both .xcresults to JUnit and hard-fail if either ran zero tests (xcresult_to_junit.py itself hard-fails the build if any test in either bundle actually failed)
        script: |
          set -e
          python3 Scripts/xcresult_to_junit.py \
            --xcresult "$RESULT_BUNDLE" \
            --junit-output "$JUNIT_OUTPUT"
          # Belt-and-braces: even if the script above somehow exits 0
          # without a file (it shouldn't), refuse to call this a pass.
          if [ ! -f "$JUNIT_OUTPUT" ]; then
            echo "FAILING BUILD: no JUnit report was produced for the main suite — refusing to report success on missing results."
            exit 1
          fi
          MAIN_TEST_COUNT=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$JUNIT_OUTPUT').getroot().get('tests','0'))")
          echo "Main suite executed test count: $MAIN_TEST_COUNT"
          if [ "$MAIN_TEST_COUNT" -eq 0 ]; then
            echo "FAILING BUILD: zero tests were executed in the main suite."
            exit 1
          fi
          # Build #237 (PR #116 R3) showed a bare XCTest-style selector
          # (no trailing "()") silently failed to exclude a Swift Testing
          # @Test function — -skip-testing exited 0 and the nonzero-count
          # check above passed while the test ran anyway. Counts alone
          # cannot catch a wrong selector; check test IDENTITY too.
          MAIN_KEYCHAIN_OCCURRENCES=$(python3 -c "import xml.etree.ElementTree as ET; root = ET.parse('$JUNIT_OUTPUT').getroot(); names = [tc.get('name', '') for tc in root.iter('testcase')]; print(sum(1 for n in names if 'keychainStoreRoundTrips' in n))")
          echo "Main suite occurrences of keychainStoreRoundTrips: $MAIN_KEYCHAIN_OCCURRENCES"
          if [ "$MAIN_KEYCHAIN_OCCURRENCES" -ne 0 ]; then
            echo "FAILING BUILD: the main suite still executed keychainStoreRoundTrips — the -skip-testing selector did not actually exclude it, so this invocation is not the previously-working unhosted environment it claims to be."
            exit 1
          fi
          python3 Scripts/xcresult_to_junit.py \
            --xcresult "$KEYCHAIN_RESULT_BUNDLE" \
            --junit-output "$KEYCHAIN_JUNIT_OUTPUT"
          if [ ! -f "$KEYCHAIN_JUNIT_OUTPUT" ]; then
            echo "FAILING BUILD: no JUnit report was produced for the isolated Keychain test — refusing to report success on missing results."
            exit 1
          fi
          KEYCHAIN_TEST_COUNT=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$KEYCHAIN_JUNIT_OUTPUT').getroot().get('tests','0'))")
          echo "Isolated Keychain test executed test count: $KEYCHAIN_TEST_COUNT"
          if [ "$KEYCHAIN_TEST_COUNT" -eq 0 ]; then
            echo "FAILING BUILD: zero tests were executed for the isolated Keychain test — it must actually run, not be silently skipped or misfiltered."
            exit 1
          fi
          KEYCHAIN_MATCH_COUNT=$(python3 -c "import xml.etree.ElementTree as ET; root = ET.parse('$KEYCHAIN_JUNIT_OUTPUT').getroot(); names = [tc.get('name', '') for tc in root.iter('testcase')]; print(sum(1 for n in names if 'keychainStoreRoundTrips' in n))")
          echo "Isolated Keychain bundle occurrences of keychainStoreRoundTrips: $KEYCHAIN_MATCH_COUNT"
          if [ "$KEYCHAIN_MATCH_COUNT" -ne 1 ] || [ "$KEYCHAIN_TEST_COUNT" -ne 1 ]; then
            echo "FAILING BUILD: expected exactly 1 test, named keychainStoreRoundTrips, in the isolated Keychain bundle — found $KEYCHAIN_TEST_COUNT test(s) with $KEYCHAIN_MATCH_COUNT matching occurrence(s). The -only-testing selector is not selecting exactly (and only) the intended test."
            exit 1
          fi
          TOTAL_TEST_COUNT=$((MAIN_TEST_COUNT + KEYCHAIN_TEST_COUNT))
          echo "Combined executed test count: $TOTAL_TEST_COUNT (main suite: $MAIN_TEST_COUNT, isolated Keychain: $KEYCHAIN_TEST_COUNT)"
    artifacts:
      - build/reports/VoxtrSprint0Tests.xcresult
      - build/reports/VoxtrSprint0TestsKeychain.xcresult
      - build/reports/junit-keychain.xml
      - build/reports/xcodebuild-test-keychain.log
      - build/reports/junit.xml
      - build/reports/discovered-tests.json
      - build/reports/xcodebuild-test.log
      - build/reports/destinations.txt
      - build/reports/signing-diagnostic-build-settings.log
      - build/reports/build-for-testing-diagnostic.log
      - build/reports/signing-diagnostic-found-xctestrun.txt
      - build/reports/signing-diagnostic-found-xctestrun.stderr
      - build/reports/signing-diagnostic-xctestrun-dump.log
      - build/reports/signing-diagnostic-found-bundles.txt
      - build/reports/signing-diagnostic-found-bundles.stderr
      - build/reports/signing-diagnostic-valid-bundles.txt
      - build/reports/signing-diagnostic-entitlements.log
    publishing:
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: false
          failure: true

  # =======================================================================
  # 2. athlete-simulator-build — no signing needed.
  # =======================================================================
  athlete-simulator-build:
    name: Vǫxtr Athlete — Simulator build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        XCODE_SCHEME: "AthleteApp"
    # CI-01: no automatic triggers — this workflow no longer runs on push
    # or pull request. It stays available for manual runs in Codemagic
    # (removing "triggering" entirely doesn't disable manual execution,
    # it only removes automatic webhook-based triggering).
    scripts:
      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies both are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          echo "== Bundle identifiers =="
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            | grep -i PRODUCT_BUNDLE_IDENTIFIER || true
      - name: Build AthleteApp for the simulator (no signing required)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    publishing:
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: false
          failure: true

  # =======================================================================
  # 3. parent-simulator-build — no signing needed.
  # =======================================================================
  parent-simulator-build:
    name: Vǫxtr Parent — Simulator build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        XCODE_SCHEME: "ParentApp"
    # CI-01: no automatic triggers — this workflow no longer runs on push
    # or pull request. It stays available for manual runs in Codemagic
    # (removing "triggering" entirely doesn't disable manual execution,
    # it only removes automatic webhook-based triggering).
    scripts:
      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies both are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          echo "== Bundle identifiers =="
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            | grep -i PRODUCT_BUNDLE_IDENTIFIER || true
      - name: Build ParentApp for the simulator (no signing required)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    publishing:
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: false
          failure: true

  # =======================================================================
  # 4. pr-validation (CI-01) — the ONLY automatic PR check now. Runs the
  #    same test process as package-tests, hard-failing on zero tests,
  #    and ONLY IF that passes, builds AthleteApp, and ONLY IF that
  #    passes, builds ParentApp. No `ignore_failure: true` anywhere in
  #    this workflow — Codemagic's default behavior (stop the whole
  #    build on the first non-zero-exit script) is exactly what
  #    enforces "a failed test or build step must stop all later steps."
  # =======================================================================
  pr-validation:
    name: Vǫxtr — PR validation (tests → AthleteApp → ParentApp)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        XCODE_SCHEME: "VoxtrTests"
        ATHLETE_SCHEME: "AthleteApp"
        PARENT_SCHEME: "ParentApp"
        RESULT_BUNDLE: "build/reports/VoxtrSprint0Tests.xcresult"
        JUNIT_OUTPUT: "build/reports/junit.xml"
        KEYCHAIN_RESULT_BUNDLE: "build/reports/VoxtrSprint0TestsKeychain.xcresult"
        KEYCHAIN_JUNIT_OUTPUT: "build/reports/junit-keychain.xml"
    triggering:
      events:
        - pull_request
      # Only PRs targeting develop — normal Vǫxtr development merges task
      # branches into develop, so that is the branch Codemagic must gate.
      # source:false = match the PR's TARGET branch, not its source, so
      # this runs regardless of which task branch the PR comes from. No
      # push event declared at all, so (unlike the workflows above in
      # earlier rounds) there is no push-to-develop leak here — this
      # workflow structurally cannot run on any push (package-tests above
      # already owns push-to-develop).
      branch_patterns:
        - pattern: "*"
          include: false
        - pattern: develop
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies all are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          echo "== Bundle identifiers =="
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            | grep -i PRODUCT_BUNDLE_IDENTIFIER || true

      # AthleteApp Release signing closeout: the smallest regression
      # assertion that Release for either app can never again silently
      # disable code signing (see the script's own doc comment for the
      # full rationale) — a plain, dependency-free script matching this
      # repo's own established Scripts/*.py CI-check pattern, not a new
      # test framework.
      - name: Verify neither app's Release build disables code signing
        script: python3 Scripts/check_release_signing_enabled.py

      - name: Auto-detect an available iOS Simulator via simctl
        script: |
          set -e
          mkdir -p build/reports
          SIMULATOR_UDID=$(python3 Scripts/pick_simulator.py)
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "FAILING BUILD: simctl reports no available iPhone simulator on this CI image at all."
            exit 1
          fi
          echo "Auto-detected simulator UDID: $SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$CM_ENV"

      - name: Build AthleteApp as a Keychain-capable test host for VoxtrSprint0Tests (plain app build, ad hoc signed, same fixed derived-data path — NOT the standalone compile-check build elsewhere in this workflow)
        script: |
          set -eo pipefail
          DIAG_DD="$(pwd)/build/DiagDerivedData"
          rm -rf "$DIAG_DD"
          mkdir -p build/reports
          # Build #232 artifacts (PR #116 R3) established via the actual
          # .xctestrun that VoxtrSprint0Tests, with no TEST_HOST, runs
          # inside the standalone iPhoneSimulator-platform `xctest`
          # agent — not any application. The ad-hoc-signed .xctest
          # bundle's own entitlements dump empty, so signing the
          # *bundle* alone cannot fix real Keychain access (already
          # tried and confirmed insufficient); the agent's own
          # entitlements were never directly inspected, so this does
          # not claim they are proven absent too. The attempted fix is
          # an application-hosted execution path: build AthleteApp
          # here as the TEST_HOST, ad hoc signed exactly like the test
          # bundle, reusing its own already-existing entitlements
          # configuration (AthleteApp/AthleteApp.entitlements) — no new
          # team identifier invented, Apple's own xctest binary
          # untouched. TEST_HOST/BUNDLE_LOADER are set on the
          # VoxtrSprint0Tests target in project.pbxproj (not as a
          # global xcodebuild override here — build #234 showed that
          # leaks into every SwiftPM dependency target's link command
          # and breaks their relocatable (-r) link step). Build #234
          # also found AthleteApp's own ad-hoc-signed entitlements dump
          # as an empty dict — this build step alone does not prove
          # AthleteApp is actually Keychain-capable; the diagnostic step
          # below inspects its real codesign output, and the real test
          # result is the only real evidence either way.
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$ATHLETE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$DIAG_DD" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/reports/athlete-app-test-host-build.log
          ATHLETE_APP_BUNDLE=$(find "$DIAG_DD/Build/Products" -iname "AthleteApp.app" | head -n1)
          if [ -z "$ATHLETE_APP_BUNDLE" ]; then
            echo "FAILING BUILD: AthleteApp.app not found under $DIAG_DD/Build/Products after building it as the Keychain test host for VoxtrSprint0Tests — see athlete-app-test-host-build.log."
            exit 1
          fi
          TEST_HOST_PATH="$ATHLETE_APP_BUNDLE/AthleteApp"
          if [ ! -f "$TEST_HOST_PATH" ]; then
            echo "FAILING BUILD: resolved AthleteApp.app but its executable is missing at $TEST_HOST_PATH"
            exit 1
          fi
          echo "Resolved TEST_HOST_PATH=$TEST_HOST_PATH"
          echo "TEST_HOST_PATH=$TEST_HOST_PATH" >> "$CM_ENV"

      - name: Diagnose VoxtrSprint0Tests signing/entitlements (AthleteApp test host, fixed derived-data path, real evidence; read-only, never fails the build)
        script: |
          set +e
          DIAG_DD="$(pwd)/build/DiagDerivedData"
          echo "== FULL (unfiltered) effective build settings for VoxtrTests scheme (ad hoc signing + AthleteApp TEST_HOST applied) =="
          xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$DIAG_DD" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            > build/reports/signing-diagnostic-build-settings.log 2>&1
          echo "xcodebuild -showBuildSettings exit code: $?" | tee -a build/reports/signing-diagnostic-build-settings.log
          echo "== Building VoxtrSprint0Tests for testing, hosted inside AthleteApp at $TEST_HOST_PATH, same fixed derived-data path the real test step below now also uses =="
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$DIAG_DD" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            > build/reports/build-for-testing-diagnostic.log 2>&1
          BUILD_FOR_TESTING_EXIT=$?
          echo "xcodebuild build-for-testing exit code: $BUILD_FOR_TESTING_EXIT" | tee -a build/reports/build-for-testing-diagnostic.log
          echo "== Locating .xctestrun files — the definitive declaration of the actual test host/runner, not an inferred one =="
          find "$DIAG_DD" -iname "*.xctestrun" \
            > build/reports/signing-diagnostic-found-xctestrun.txt \
            2> build/reports/signing-diagnostic-found-xctestrun.stderr
          echo "-- find stdout (candidate paths, one per line) --"
          cat build/reports/signing-diagnostic-found-xctestrun.txt
          echo "-- find stderr (errors only — NOT candidate paths) --"
          cat build/reports/signing-diagnostic-found-xctestrun.stderr
          : > build/reports/signing-diagnostic-xctestrun-dump.log
          while IFS= read -r runfile; do
            [ -f "$runfile" ] || { echo "SKIPPING non-existent path from find output: $runfile" | tee -a build/reports/signing-diagnostic-xctestrun-dump.log; continue; }
            echo "--- $runfile ---" | tee -a build/reports/signing-diagnostic-xctestrun-dump.log
            /usr/libexec/PlistBuddy -c "Print" "$runfile" 2>&1 | tee -a build/reports/signing-diagnostic-xctestrun-dump.log
          done < build/reports/signing-diagnostic-found-xctestrun.txt
          echo "== Enumerating every .xctest/.app bundle under the fixed derived-data Products directory =="
          find "$DIAG_DD/Build/Products" \( -iname "*.xctest" -o -iname "*.app" \) \
            > build/reports/signing-diagnostic-found-bundles.txt \
            2> build/reports/signing-diagnostic-found-bundles.stderr
          echo "-- find stdout (candidate paths, one per line) --"
          cat build/reports/signing-diagnostic-found-bundles.txt
          echo "-- find stderr (errors only — NOT candidate paths; e.g. Products dir missing) --"
          cat build/reports/signing-diagnostic-found-bundles.stderr
          # Only lines that are real, existing paths count as "found" — find's own
          # stderr (e.g. "No such file or directory") goes to a SEPARATE file above
          # specifically so it can never be mistaken for a discovered bundle path.
          : > build/reports/signing-diagnostic-valid-bundles.txt
          while IFS= read -r bundle; do
            [ -e "$bundle" ] && echo "$bundle" >> build/reports/signing-diagnostic-valid-bundles.txt
          done < build/reports/signing-diagnostic-found-bundles.txt
          : > build/reports/signing-diagnostic-entitlements.log
          if [ ! -s build/reports/signing-diagnostic-valid-bundles.txt ]; then
            echo "INCOMPLETE COLLECTION: no real .xctest/.app bundle path found under $DIAG_DD/Build/Products (build-for-testing exit was $BUILD_FOR_TESTING_EXIT — see build-for-testing-diagnostic.log and signing-diagnostic-found-bundles.stderr for why). This is NOT entitlement evidence — it means collection itself did not find anything to inspect." \
              | tee build/reports/signing-diagnostic-entitlements.log
          else
            while IFS= read -r bundle; do
              echo "--- entitlements: $bundle ---" | tee -a build/reports/signing-diagnostic-entitlements.log
              codesign -d --entitlements :- "$bundle" 2>&1 | tee -a build/reports/signing-diagnostic-entitlements.log
              echo "--- codesign -dvvv: $bundle ---" | tee -a build/reports/signing-diagnostic-entitlements.log
              codesign -dvvv "$bundle" 2>&1 | tee -a build/reports/signing-diagnostic-entitlements.log
            done < build/reports/signing-diagnostic-valid-bundles.txt
          fi
          echo "== Also inspecting the resolved TEST_HOST executable directly — the ACTUAL host this run declares via TEST_HOST/BUNDLE_LOADER, cross-checked against the .xctestrun TestHostPath dump above, not a disconnected xcrun guess =="
          echo "TEST_HOST_PATH=$TEST_HOST_PATH" | tee -a build/reports/signing-diagnostic-entitlements.log
          if [ -f "$TEST_HOST_PATH" ]; then
            echo "--- entitlements: $TEST_HOST_PATH ---" | tee -a build/reports/signing-diagnostic-entitlements.log
            codesign -d --entitlements :- "$TEST_HOST_PATH" 2>&1 | tee -a build/reports/signing-diagnostic-entitlements.log
            echo "--- codesign -dvvv: $TEST_HOST_PATH ---" | tee -a build/reports/signing-diagnostic-entitlements.log
            codesign -dvvv "$TEST_HOST_PATH" 2>&1 | tee -a build/reports/signing-diagnostic-entitlements.log
          else
            echo "TEST_HOST_PATH does not exist as a file: $TEST_HOST_PATH" | tee -a build/reports/signing-diagnostic-entitlements.log
          fi
          exit 0

      - name: Run VoxtrSprint0Tests main suite (previously-working standalone environment — excludes the real-Keychain round-trip test, isolated in a separate hosted step below)
        script: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE"
          # R3 status (PR #116 review thread): build #236 confirmed
          # TEST_HOST=AthleteApp (set in project.pbxproj) makes the real
          # Keychain round-trip test
          # (AthleteDeviceAuthorizationSessionManagerTests
          # .keychainStoreRoundTrips) genuinely pass — the original
          # errSecMissingEntitlement (-34018) symptom is fixed by
          # application-hosted execution. But hosting the ENTIRE
          # 903-test suite inside AthleteApp's process changes its
          # persistence/CloudKit environment: build #236's actual log
          # showed repeated harness restarts and hundreds of
          # SwiftData/CloudKit model-container failures
          # (NSCocoaErrorDomain 134060, "CloudKit integration requires
          # that all attributes be optional...") — a regression from
          # running every domain/persistence test inside one shared app
          # process with AthleteApp's own production CloudKit-backed
          # SwiftData container, not anything to do with Keychain access.
          # Not a reason to touch any production model or CloudKit
          # configuration. This step restores the previously-working
          # standalone (no TEST_HOST) execution for every test except
          # the one that actually needs a Keychain-capable host,
          # explicitly clearing TEST_HOST/BUNDLE_LOADER back to empty on
          # the command line for this one invocation only — the isolated
          # Keychain step below keeps project.pbxproj's default.
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$(pwd)/build/DiagDerivedData" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -skip-testing:VoxtrSprint0Tests/AthleteDeviceAuthorizationSessionManagerTests/keychainStoreRoundTrips() \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            TEST_HOST= \
            BUNDLE_LOADER= \
            2>&1 | tee build/reports/xcodebuild-test.log

      - name: Run the real Keychain round-trip test hosted inside AthleteApp (isolated — build #236 confirmed this exact test passes genuinely; running it alongside the full suite in the same app process caused the unrelated SwiftData/CloudKit regression above)
        script: |
          set -o pipefail
          rm -rf "$KEYCHAIN_RESULT_BUNDLE"
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$(pwd)/build/DiagDerivedData" \
            -resultBundlePath "$KEYCHAIN_RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -only-testing:VoxtrSprint0Tests/AthleteDeviceAuthorizationSessionManagerTests/keychainStoreRoundTrips() \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/reports/xcodebuild-test-keychain.log

      - name: Convert both .xcresults to JUnit and hard-fail if either ran zero tests (xcresult_to_junit.py itself hard-fails the build if any test in either bundle actually failed)
        script: |
          set -e
          python3 Scripts/xcresult_to_junit.py \
            --xcresult "$RESULT_BUNDLE" \
            --junit-output "$JUNIT_OUTPUT"
          if [ ! -f "$JUNIT_OUTPUT" ]; then
            echo "FAILING BUILD: no JUnit report was produced for the main suite — refusing to report success on missing results."
            exit 1
          fi
          MAIN_TEST_COUNT=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$JUNIT_OUTPUT').getroot().get('tests','0'))")
          echo "Main suite executed test count: $MAIN_TEST_COUNT"
          if [ "$MAIN_TEST_COUNT" -eq 0 ]; then
            echo "FAILING BUILD: zero tests were executed in the main suite."
            exit 1
          fi
          # Build #237 (PR #116 R3) showed a bare XCTest-style selector
          # (no trailing "()") silently failed to exclude a Swift Testing
          # @Test function — -skip-testing exited 0 and the nonzero-count
          # check above passed while the test ran anyway. Counts alone
          # cannot catch a wrong selector; check test IDENTITY too.
          MAIN_KEYCHAIN_OCCURRENCES=$(python3 -c "import xml.etree.ElementTree as ET; root = ET.parse('$JUNIT_OUTPUT').getroot(); names = [tc.get('name', '') for tc in root.iter('testcase')]; print(sum(1 for n in names if 'keychainStoreRoundTrips' in n))")
          echo "Main suite occurrences of keychainStoreRoundTrips: $MAIN_KEYCHAIN_OCCURRENCES"
          if [ "$MAIN_KEYCHAIN_OCCURRENCES" -ne 0 ]; then
            echo "FAILING BUILD: the main suite still executed keychainStoreRoundTrips — the -skip-testing selector did not actually exclude it, so this invocation is not the previously-working unhosted environment it claims to be."
            exit 1
          fi
          python3 Scripts/xcresult_to_junit.py \
            --xcresult "$KEYCHAIN_RESULT_BUNDLE" \
            --junit-output "$KEYCHAIN_JUNIT_OUTPUT"
          if [ ! -f "$KEYCHAIN_JUNIT_OUTPUT" ]; then
            echo "FAILING BUILD: no JUnit report was produced for the isolated Keychain test — refusing to report success on missing results."
            exit 1
          fi
          KEYCHAIN_TEST_COUNT=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$KEYCHAIN_JUNIT_OUTPUT').getroot().get('tests','0'))")
          echo "Isolated Keychain test executed test count: $KEYCHAIN_TEST_COUNT"
          if [ "$KEYCHAIN_TEST_COUNT" -eq 0 ]; then
            echo "FAILING BUILD: zero tests were executed for the isolated Keychain test — it must actually run, not be silently skipped or misfiltered."
            exit 1
          fi
          KEYCHAIN_MATCH_COUNT=$(python3 -c "import xml.etree.ElementTree as ET; root = ET.parse('$KEYCHAIN_JUNIT_OUTPUT').getroot(); names = [tc.get('name', '') for tc in root.iter('testcase')]; print(sum(1 for n in names if 'keychainStoreRoundTrips' in n))")
          echo "Isolated Keychain bundle occurrences of keychainStoreRoundTrips: $KEYCHAIN_MATCH_COUNT"
          if [ "$KEYCHAIN_MATCH_COUNT" -ne 1 ] || [ "$KEYCHAIN_TEST_COUNT" -ne 1 ]; then
            echo "FAILING BUILD: expected exactly 1 test, named keychainStoreRoundTrips, in the isolated Keychain bundle — found $KEYCHAIN_TEST_COUNT test(s) with $KEYCHAIN_MATCH_COUNT matching occurrence(s). The -only-testing selector is not selecting exactly (and only) the intended test."
            exit 1
          fi
          TOTAL_TEST_COUNT=$((MAIN_TEST_COUNT + KEYCHAIN_TEST_COUNT))
          echo "Combined executed test count: $TOTAL_TEST_COUNT (main suite: $MAIN_TEST_COUNT, isolated Keychain: $KEYCHAIN_TEST_COUNT)"

      - name: Build AthleteApp for the simulator (only reached if tests passed)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$ATHLETE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build ParentApp for the simulator (only reached if AthleteApp built)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$PARENT_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/reports/VoxtrSprint0Tests.xcresult
      - build/reports/VoxtrSprint0TestsKeychain.xcresult
      - build/reports/junit.xml
      - build/reports/junit-keychain.xml
      - build/reports/xcodebuild-test.log
      - build/reports/xcodebuild-test-keychain.log
      - build/reports/signing-diagnostic-build-settings.log
      - build/reports/build-for-testing-diagnostic.log
      - build/reports/signing-diagnostic-found-xctestrun.txt
      - build/reports/signing-diagnostic-found-xctestrun.stderr
      - build/reports/signing-diagnostic-xctestrun-dump.log
      - build/reports/signing-diagnostic-found-bundles.txt
      - build/reports/signing-diagnostic-found-bundles.stderr
      - build/reports/signing-diagnostic-valid-bundles.txt
      - build/reports/signing-diagnostic-entitlements.log
    publishing:
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: false
          failure: true

  # =======================================================================
  # 5. testflight-release — REAL signing. Nothing in this workflow is a
  #    literal secret: the API key, Team ID, certificate, and profiles are
  #    all fetched at runtime from Codemagic's App Store Connect
  #    integration and environment variable group, referenced here only
  #    by NAME. See README.md → "Codemagic Setup Requirements" for what
  #    you must configure in the Codemagic UI before this workflow can
  #    run — none of it goes in this repo.
  #
  #    KNOWN GAP (PR #62 follow-up): this workflow's `ios_signing` block
  #    below declares only `bundle_identifier: $ATHLETE_BUNDLE_ID` —
  #    Codemagic's documented schema does not support a list of bundle
  #    identifiers there, so it cannot also intentionally declare
  #    ParentApp's. ParentApp's "Archive and export ParentApp" step below
  #    therefore signs using whatever `xcode-project use-profiles` can
  #    resolve from the keychain at that point, not an explicit
  #    declaration in this workflow — unverified, not "fixed" by this
  #    follow-up. The two proven, single-target manual workflows
  #    (`testflight-parent`, `testflight-athlete`) are each intentionally
  #    signed and are the acceptance gate for the AthleteApp signing fix.
  #    Correctly declaring both targets here would need Codemagic's
  #    documented multi-profile mechanism (explicit `provisioning_profiles`/
  #    `certificates` reference lists), whose real names for this account
  #    are not yet known/verified — do not invent them.
  # =======================================================================
  testflight-release:
    name: Vǫxtr — TestFlight release (AthleteApp + ParentApp)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Reference to a Codemagic "App Store Connect" integration, configured
    # under Team settings → Integrations in the Codemagic UI. The actual
    # Issuer ID, Key ID, and .p8 private key live only there — this is a
    # NAME, not a credential.
    integrations:
      app_store_connect: "Vøxtr App Store Connect"

    environment:
      xcode: latest
      # Codemagic environment variable group, configured in the Codemagic
      # UI under this workflow/app's Environment variables. See README.
      groups:
        - voxtr_ios_signing
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        ATHLETE_SCHEME: "AthleteApp"
        PARENT_SCHEME: "ParentApp"
        ATHLETE_BUNDLE_ID: "app.voxtr.athlete"
        PARENT_BUNDLE_ID: "app.voxtr.parent"
      # Automatic code signing through Codemagic: distribution_type +
      # bundle_identifier is enough for Codemagic to resolve the signing
      # identity via the app_store_connect integration above — no manual
      # certificate/profile files anywhere in this repo.
      #
      # PR #62 follow-up: a prior revision of this comment/config listed
      # BOTH $ATHLETE_BUNDLE_ID and $PARENT_BUNDLE_ID here on the
      # assumption that `ios_signing.bundle_identifier` accepts a list.
      # Codemagic's documented schema defines `bundle_identifier` as a
      # SINGLE bundle identifier string — a generic YAML parse does not
      # validate that, so this repo should not rely on an undocumented
      # list value here. Reverted to the single, documented form this
      # workflow already shipped with (Athlete only). This means this
      # workflow's own `ios_signing` block is NOT a verified, intentional
      # signing declaration for ParentApp's archive step below — see the
      # header comment above this workflow, and the PR #62 follow-up
      # delivery report, for what that means and what remains an open
      # decision (Codemagic's documented multi-profile mechanism is
      # explicit `provisioning_profiles`/`certificates` reference lists,
      # which this repo does not yet have verified names for — inventing
      # them here would be worse than leaving this honestly unresolved).
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $ATHLETE_BUNDLE_ID

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "release/*"
          include: true

    scripts:
      - name: Fail clearly if required signing configuration is missing
        script: |
          set -e
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID — configure the '${CM_INTEGRATION_NAME:-voxtr_app_store_connect}' App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Missing APP_STORE_CONNECT_KEY_IDENTIFIER — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          echo "App Store Connect signing configuration present — proceeding."

      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies both are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$ATHLETE_SCHEME"
          echo "== Bundle identifiers =="
          echo "AthleteApp: $ATHLETE_BUNDLE_ID"
          echo "ParentApp:  $PARENT_BUNDLE_ID"

      - name: Apply Codemagic project build number via Apple Generic Versioning
        script: |
          set -e
          # PROJECT_BUILD_NUMBER is a Codemagic-provided, project-level
          # build counter that increases across builds — never hardcoded
          # here. Applied once, before either archive: agvtool
          # new-version -all updates CURRENT_PROJECT_VERSION for every
          # target in the project in one call, so the same build number
          # ends up on both AthleteApp and ParentApp — safe because they
          # have separate bundle identifiers and separate App Store
          # Connect records, so this is not a version collision between
          # two different apps, just one shared counter across both.
          : "${PROJECT_BUILD_NUMBER:?Missing PROJECT_BUILD_NUMBER — this is a Codemagic-provided variable and should always be present in a Codemagic build.}"
          echo "Applying build number: $PROJECT_BUILD_NUMBER"
          (cd "$(dirname "$XCODE_PROJECT")" && agvtool new-version -all "$PROJECT_BUILD_NUMBER")
          echo "== Verifying the build number was actually applied =="
          APPLIED_VERSION=$(xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$ATHLETE_SCHEME" \
            | grep -m1 "CURRENT_PROJECT_VERSION" | awk -F'= ' '{print $2}' | tr -d '[:space:]')
          echo "CURRENT_PROJECT_VERSION now resolves to: $APPLIED_VERSION"
          if [ "$APPLIED_VERSION" != "$PROJECT_BUILD_NUMBER" ]; then
            echo "FAILING BUILD: agvtool did not apply the expected build number. This project may not have Apple Generic Versioning (VERSIONING_SYSTEM = apple-generic) configured for every target — see README: Codemagic Setup Requirements."
            exit 1
          fi

      - name: Initialize keychain for code signing
        script: keychain initialize

      - name: Add certificates to keychain and apply provisioning profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Archive and export AthleteApp (Release)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$ATHLETE_SCHEME" \
            --config Release

      # AthleteApp Release signing closeout: the exact same class of risk
      # the ParentApp diagnostic below was built for — Release signing was
      # previously disabled at the project level for AthleteApp too (fixed
      # in App/Voxtr.xcodeproj/project.pbxproj), so this is the first real
      # signed AthleteApp build. This step never rebuilds or re-signs
      # anything; it only inspects the IPA/archive `xcode-project build-ipa`
      # above already produced. FAIL_ON_MISMATCH=true: this workflow must
      # refuse to publish an AthleteApp that would crash on
      # `CKContainer(identifier:)` the same way ParentApp once did — see
      # Scripts/capture_parent_signed_entitlements.sh's own doc comment for
      # why this differs from ParentApp's own (unset, report-only) call
      # below. PR #83 follow-up: EXPECTED_ICLOUD_ENVIRONMENT=Production
      # additionally requires the final signed app be provisioned for the
      # real distribution CloudKit environment, never Development — a
      # services/containers-only MATCH is not sufficient for a TestFlight
      # release. REQUIRE_ARCHIVE=true additionally fails this step if no
      # readable AthleteApp archive entitlements were found, so
      # Source -> Archive -> Final IPA localization is guaranteed, not
      # merely attempted.
      - name: Capture AthleteApp final signed CloudKit entitlements
        script: APP_NAME=AthleteApp BUNDLE_ID="$ATHLETE_BUNDLE_ID" FAIL_ON_MISMATCH=true EXPECTED_ICLOUD_ENVIRONMENT=Production REQUIRE_ARCHIVE=true bash Scripts/capture_parent_signed_entitlements.sh

      - name: Archive and export ParentApp (Release)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$PARENT_SCHEME" \
            --config Release

      # ParentApp signed-entitlements diagnostic follow-up (build 516):
      # symbolication proved the TestFlight crash traps at
      # `CKContainer(identifier:)` realization itself, before any zone/
      # share/record work — the open question is whether the FINAL SIGNED,
      # exported ParentApp .ipa actually carries the CloudKit/iCloud
      # entitlements the source `ParentApp.entitlements` file declares.
      # Export/re-signing can alter entitlements after archiving, so
      # neither the source file nor the `.xcarchive` above is authoritative
      # here — only the exported `.ipa` is. This step never rebuilds or
      # re-signs anything; it only inspects the IPA `xcode-project build-ipa`
      # already produced. See Scripts/capture_parent_signed_entitlements.sh
      # for the full extraction logic (it locates ParentApp's own .ipa by
      # CFBundleIdentifier, since this workflow builds AthleteApp's .ipa
      # into the same directory). FAIL_ON_MISMATCH is deliberately left
      # unset here — Parent's own historical report-only semantics are
      # unchanged by the AthleteApp Release signing closeout.
      - name: Capture ParentApp final signed CloudKit entitlements
        script: APP_NAME=ParentApp BUNDLE_ID="$PARENT_BUNDLE_ID" bash Scripts/capture_parent_signed_entitlements.sh

      # ITMS-90683 follow-up (PR #91): authoritative post-build proof that
      # ParentApp's final signed executable genuinely contains no concrete
      # AVFoundation camera symbols — inspects the exact .ipa the archive
      # step above just produced (see the script's own doc comment).
      # Deliberately NOT run for AthleteApp: it legitimately links these
      # symbols for its own "Scan connection code" screen.
      - name: Verify ParentApp final signed executable has no camera symbols
        script: APP_NAME=ParentApp BUNDLE_ID="$PARENT_BUNDLE_ID" bash Scripts/check_no_camera_symbols.sh

    # ParentApp crash symbolication follow-up: `xcode-project build-ipa`
    # (used for both apps above) archives to `build/ios/xcarchive/*.xcarchive`
    # by default and never deletes it (no `--remove-xcarchive` flag is
    # passed anywhere in this file) — that archive's own `dSYMs/` folder is
    # where each app's `.dSYM` actually lives, since neither app's Release
    # configuration overrides `DEBUG_INFORMATION_FORMAT`, so both fall back
    # to Xcode's own `dwarf-with-dsym` default. Previously this archive was
    # never declared as a Codemagic artifact, so it was silently discarded
    # when the ephemeral build machine was torn down — leaving no way to
    # symbolicate a TestFlight crash after the fact. This is the exact
    # archive actually used to export/upload the IPA above, not a
    # separately rebuilt one.
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - build/diagnostics/AthleteApp-signed-entitlements.plist
      - build/diagnostics/AthleteApp-profile-entitlements.plist
      - build/diagnostics/AthleteApp-profile-summary.txt
      - build/diagnostics/AthleteApp-archive-signed-entitlements.plist
      - build/diagnostics/AthleteApp-cloudkit-entitlements.txt
      - build/diagnostics/ParentApp-signed-entitlements.plist
      - build/diagnostics/ParentApp-profile-entitlements.plist
      - build/diagnostics/ParentApp-profile-summary.txt
      - build/diagnostics/ParentApp-archive-signed-entitlements.plist
      - build/diagnostics/ParentApp-cloudkit-entitlements.txt

    publishing:
      # Publishes every IPA produced above to App Store Connect/TestFlight,
      # authenticating via the same named integration — no key material
      # in this file.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: true
          failure: true

  # =======================================================================
  # 6. testflight-parent — manual only. Builds and publishes ONLY
  #    ParentApp to TestFlight, independently of the release-tag
  #    workflow above — no Git tag required. No `triggering` section at
  #    all: Codemagic still allows starting any workflow manually from
  #    the UI/API regardless of whether it declares automatic triggers
  #    (see `athlete-simulator-build`/`parent-simulator-build` above for
  #    the same pattern) — omitting `triggering` here specifically means
  #    this workflow has no automatic trigger of any kind, so it never
  #    runs from an ordinary push to develop. Same signing approach as
  #    testflight-release: the App Store Connect integration and
  #    environment variable group are referenced by name only — nothing
  #    in this file is a credential.
  # =======================================================================
  testflight-parent:
    name: "Vǫxtr Parent — Manual TestFlight"
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Vøxtr App Store Connect"

    environment:
      xcode: latest
      groups:
        - voxtr_ios_signing
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        PARENT_SCHEME: "ParentApp"
        PARENT_BUNDLE_ID: "app.voxtr.parent"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $PARENT_BUNDLE_ID

    scripts:
      - name: Fail clearly if required signing configuration is missing
        script: |
          set -e
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID — configure the '${CM_INTEGRATION_NAME:-voxtr_app_store_connect}' App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Missing APP_STORE_CONNECT_KEY_IDENTIFIER — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          echo "App Store Connect signing configuration present — proceeding."

      - name: Validate Xcode version, required scheme, and expected bundle identifier
        script: |
          set -e
          mkdir -p build/reports
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Verifying scheme '$PARENT_SCHEME' exists in $XCODE_PROJECT =="
          xcodebuild -list -project "$XCODE_PROJECT" -json > build/reports/schemes.json
          SCHEME_FOUND=$(python3 -c "
          import json
          with open('build/reports/schemes.json') as f:
              data = json.load(f)
          schemes = data.get('project', {}).get('schemes', [])
          print('yes' if '$PARENT_SCHEME' in schemes else 'no')
          ")
          if [ "$SCHEME_FOUND" != "yes" ]; then
            echo "FAILING BUILD: scheme '$PARENT_SCHEME' was not found in $XCODE_PROJECT."
            xcodebuild -list -project "$XCODE_PROJECT"
            exit 1
          fi
          echo "Scheme '$PARENT_SCHEME' found."
          echo "== Verifying expected bundle identifier is present =="
          RESOLVED_BUNDLE_ID=$(xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$PARENT_SCHEME" \
            -destination "generic/platform=iOS" \
            | awk -F' = ' '$1 ~ /^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER$/ { print $2; exit }' \
            | tr -d '[:space:]')
          echo "Resolved bundle identifier: $RESOLVED_BUNDLE_ID"
          if [ "$RESOLVED_BUNDLE_ID" != "$PARENT_BUNDLE_ID" ]; then
            echo "FAILING BUILD: resolved bundle identifier '$RESOLVED_BUNDLE_ID' does not match expected '$PARENT_BUNDLE_ID'."
            exit 1
          fi
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$PARENT_SCHEME"

      - name: Apply Codemagic project build number via Apple Generic Versioning
        script: |
          set -e
          # PROJECT_BUILD_NUMBER is a Codemagic-provided, project-level
          # build counter that increases across builds — never hardcoded
          # here.
          : "${PROJECT_BUILD_NUMBER:?Missing PROJECT_BUILD_NUMBER — this is a Codemagic-provided variable and should always be present in a Codemagic build.}"
          echo "Applying build number: $PROJECT_BUILD_NUMBER"
          (cd "$(dirname "$XCODE_PROJECT")" && agvtool new-version -all "$PROJECT_BUILD_NUMBER")
          echo "== Verifying the build number was actually applied =="
          APPLIED_VERSION=$(xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$PARENT_SCHEME" \
            | grep -m1 "CURRENT_PROJECT_VERSION" | awk -F'= ' '{print $2}' | tr -d '[:space:]')
          echo "CURRENT_PROJECT_VERSION now resolves to: $APPLIED_VERSION"
          if [ "$APPLIED_VERSION" != "$PROJECT_BUILD_NUMBER" ]; then
            echo "FAILING BUILD: agvtool did not apply the expected build number. This project may not have Apple Generic Versioning (VERSIONING_SYSTEM = apple-generic) configured — see README: Codemagic Setup Requirements."
            exit 1
          fi

      - name: Initialize keychain for code signing
        script: keychain initialize

      - name: Add certificates to keychain and apply provisioning profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Archive and export ParentApp (Release)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$PARENT_SCHEME" \
            --config Release

      # ParentApp signed-entitlements diagnostic follow-up: see
      # testflight-release's own step comment above for the full
      # rationale — same script (Scripts/capture_parent_signed_entitlements.sh),
      # inspecting the exact IPA this workflow just exported/uploads.
      # FAIL_ON_MISMATCH is deliberately left unset — Parent's own
      # historical report-only semantics, unchanged by the AthleteApp
      # Release signing closeout.
      - name: Capture ParentApp final signed CloudKit entitlements
        script: APP_NAME=ParentApp BUNDLE_ID="$PARENT_BUNDLE_ID" bash Scripts/capture_parent_signed_entitlements.sh

      # ITMS-90683 follow-up (PR #91): see testflight-release's own step
      # comment above for the full rationale — this is the workflow most
      # likely to be run manually to re-validate this exact regression.
      - name: Verify ParentApp final signed executable has no camera symbols
        script: APP_NAME=ParentApp BUNDLE_ID="$PARENT_BUNDLE_ID" bash Scripts/check_no_camera_symbols.sh

    # ParentApp crash symbolication follow-up: see testflight-release's own
    # artifacts comment above for the full rationale — same tool
    # (`xcode-project build-ipa`), same default archive path, same
    # dwarf-with-dsym fallback, same prior gap (the archive/dSYM this
    # workflow actually uses to export/upload the IPA was never published).
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - build/diagnostics/ParentApp-signed-entitlements.plist
      - build/diagnostics/ParentApp-profile-entitlements.plist
      - build/diagnostics/ParentApp-profile-summary.txt
      - build/diagnostics/ParentApp-archive-signed-entitlements.plist
      - build/diagnostics/ParentApp-cloudkit-entitlements.txt

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: true
          failure: true

  # =======================================================================
  # 7. testflight-athlete — manual only. Same structure as
  #    testflight-parent immediately above, scoped to AthleteApp instead.
