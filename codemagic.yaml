workflows:

  # =======================================================================
  # 1. package-tests — runs the native VoxtrSprint0Tests unit test target
  #    via the dedicated VoxtrTests scheme, against a concrete simulator
  #    destination (xcodebuild test cannot run against a generic
  #    destination). The simulator device is AUTO-DETECTED from
  #    `xcodebuild -showdestinations` rather than hardcoded — a hardcoded
  #    device name (e.g. "iPhone 16") breaks the moment Apple's simulator
  #    lineup moves on to a newer generation on the CI image, which is
  #    exactly what happened here. Produces a REAL .xcresult and converts
  #    it to JUnit with Scripts/xcresult_to_junit.py — not xcpretty. The
  #    workflow hard-fails if zero tests execute, if no destination can
  #    be auto-detected, or if the result bundle/JUnit conversion can't
  #    be produced at all — it never falls back to an empty passing report.
  # =======================================================================
  package-tests:
    name: Voxtr — Package unit tests (Swift Testing)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        XCODE_SCHEME: "VoxtrTests"
        RESULT_BUNDLE: "build/reports/VoxtrSprint0Tests.xcresult"
        JUNIT_OUTPUT: "build/reports/junit.xml"
    triggering:
      events:
        - push
      # Automatic trigger: push to develop ONLY. Pull-request validation
      # is handled entirely by the separate pr-validation workflow now
      # (CI-01) — this workflow no longer reacts to pull requests at all.
      branch_patterns:
        - pattern: "*"
          include: false
        - pattern: develop
          include: true
      cancel_previous_builds: true
    # CI-01: skip when only documentation changed. Per Codemagic's own
    # docs, the build after first adding this "when" block still runs
    # once regardless of changeset (needed to establish the baseline);
    # only builds AFTER that are actually skipped when the changeset
    # matches only the excluded paths.
    when:
      changeset:
        excludes:
          - "**/*.md"
    scripts:
      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies all are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          echo "== Bundle identifiers =="
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            | grep -i PRODUCT_BUNDLE_IDENTIFIER || true

      - name: Auto-detect an available iOS Simulator via simctl (more reliable than scheme-filtered -showdestinations, which returned no concrete simulators for this scheme)
        script: |
          set -e
          mkdir -p build/reports
          echo "== Informational: xcodebuild -showdestinations (may be incomplete for a test-only scheme) =="
          xcodebuild -showdestinations -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            > build/reports/destinations.txt 2>&1 || true
          cat build/reports/destinations.txt
          echo "== Querying simctl directly for an available iPhone simulator (source of truth) =="
          SIMULATOR_UDID=$(python3 Scripts/pick_simulator.py)
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "FAILING BUILD: simctl reports no available iPhone simulator on this CI image at all — see the stderr output above for the full device list. This needs a human to look at what's actually installed, not another guess from me."
            exit 1
          fi
          echo "Auto-detected simulator UDID: $SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$CM_ENV"

      - name: Print discovered tests before running (best effort — see script comments if this step's flags don't match your Xcode version)
        script: |
          set +e
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -enumerate-tests \
            -test-enumeration-format json \
            -test-enumeration-output-path build/reports/discovered-tests.json \
            CODE_SIGNING_ALLOWED=NO
          if [ -f build/reports/discovered-tests.json ]; then
            echo "== Discovered tests =="
            cat build/reports/discovered-tests.json
          else
            echo "NOTE: -enumerate-tests did not produce output on this Xcode version/image — this is a best-effort visibility step and is NOT what gates pass/fail below. Continuing."
          fi
          set -e

      - name: Run VoxtrSprint0Tests and produce a real .xcresult (no xcpretty — see script header for why)
        script: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE"
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/reports/xcodebuild-test.log

      - name: Convert .xcresult to JUnit and hard-fail if zero tests ran
        script: |
          set -e
          python3 Scripts/xcresult_to_junit.py \
            --xcresult "$RESULT_BUNDLE" \
            --junit-output "$JUNIT_OUTPUT"
          # Belt-and-braces: even if the script above somehow exits 0
          # without a file (it shouldn't), refuse to call this a pass.
          if [ ! -f "$JUNIT_OUTPUT" ]; then
            echo "FAILING BUILD: no JUnit report was produced — refusing to report success on missing results."
            exit 1
          fi
          TEST_COUNT=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$JUNIT_OUTPUT').getroot().get('tests','0'))")
          echo "Executed test count: $TEST_COUNT"
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "FAILING BUILD: zero tests were executed."
            exit 1
          fi
    artifacts:
      - build/reports/VoxtrSprint0Tests.xcresult
      - build/reports/junit.xml
      - build/reports/discovered-tests.json
      - build/reports/xcodebuild-test.log
      - build/reports/destinations.txt
    publishing:
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: false
          failure: true

  # =======================================================================
  # 2. athlete-simulator-build — no signing needed.
  # =======================================================================
  athlete-simulator-build:
    name: Vǫxtr Athlete — Simulator build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        XCODE_SCHEME: "AthleteApp"
    # CI-01: no automatic triggers — this workflow no longer runs on push
    # or pull request. It stays available for manual runs in Codemagic
    # (removing "triggering" entirely doesn't disable manual execution,
    # it only removes automatic webhook-based triggering).
    scripts:
      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies both are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          echo "== Bundle identifiers =="
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            | grep -i PRODUCT_BUNDLE_IDENTIFIER || true
      - name: Build AthleteApp for the simulator (no signing required)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    publishing:
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: false
          failure: true

  # =======================================================================
  # 3. parent-simulator-build — no signing needed.
  # =======================================================================
  parent-simulator-build:
    name: Vǫxtr Parent — Simulator build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        XCODE_SCHEME: "ParentApp"
    # CI-01: no automatic triggers — this workflow no longer runs on push
    # or pull request. It stays available for manual runs in Codemagic
    # (removing "triggering" entirely doesn't disable manual execution,
    # it only removes automatic webhook-based triggering).
    scripts:
      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies both are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          echo "== Bundle identifiers =="
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            | grep -i PRODUCT_BUNDLE_IDENTIFIER || true
      - name: Build ParentApp for the simulator (no signing required)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    publishing:
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: false
          failure: true

  # =======================================================================
  # 4. pr-validation (CI-01) — the ONLY automatic PR check now. Runs the
  #    same test process as package-tests, hard-failing on zero tests,
  #    and ONLY IF that passes, builds AthleteApp, and ONLY IF that
  #    passes, builds ParentApp. No `ignore_failure: true` anywhere in
  #    this workflow — Codemagic's default behavior (stop the whole
  #    build on the first non-zero-exit script) is exactly what
  #    enforces "a failed test or build step must stop all later steps."
  # =======================================================================
  pr-validation:
    name: Vǫxtr — PR validation (tests → AthleteApp → ParentApp)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        XCODE_SCHEME: "VoxtrTests"
        ATHLETE_SCHEME: "AthleteApp"
        PARENT_SCHEME: "ParentApp"
        RESULT_BUNDLE: "build/reports/VoxtrSprint0Tests.xcresult"
        JUNIT_OUTPUT: "build/reports/junit.xml"
    triggering:
      events:
        - pull_request
      # Only PRs targeting develop — normal Vǫxtr development merges task
      # branches into develop, so that is the branch Codemagic must gate.
      # source:false = match the PR's TARGET branch, not its source, so
      # this runs regardless of which task branch the PR comes from. No
      # push event declared at all, so (unlike the workflows above in
      # earlier rounds) there is no push-to-develop leak here — this
      # workflow structurally cannot run on any push (package-tests above
      # already owns push-to-develop).
      branch_patterns:
        - pattern: "*"
          include: false
        - pattern: develop
          include: true
          source: false
      cancel_previous_builds: true
    scripts:
      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies all are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          echo "== Bundle identifiers =="
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            | grep -i PRODUCT_BUNDLE_IDENTIFIER || true

      - name: Auto-detect an available iOS Simulator via simctl
        script: |
          set -e
          mkdir -p build/reports
          SIMULATOR_UDID=$(python3 Scripts/pick_simulator.py)
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "FAILING BUILD: simctl reports no available iPhone simulator on this CI image at all."
            exit 1
          fi
          echo "Auto-detected simulator UDID: $SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$CM_ENV"

      - name: Run VoxtrSprint0Tests and produce a real .xcresult (no xcpretty)
        script: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE"
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/reports/xcodebuild-test.log

      - name: Convert .xcresult to JUnit and hard-fail if zero tests ran
        script: |
          set -e
          python3 Scripts/xcresult_to_junit.py \
            --xcresult "$RESULT_BUNDLE" \
            --junit-output "$JUNIT_OUTPUT"
          if [ ! -f "$JUNIT_OUTPUT" ]; then
            echo "FAILING BUILD: no JUnit report was produced — refusing to report success on missing results."
            exit 1
          fi
          TEST_COUNT=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$JUNIT_OUTPUT').getroot().get('tests','0'))")
          echo "Executed test count: $TEST_COUNT"
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "FAILING BUILD: zero tests were executed."
            exit 1
          fi

      - name: Build AthleteApp for the simulator (only reached if tests passed)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$ATHLETE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build ParentApp for the simulator (only reached if AthleteApp built)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$PARENT_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/reports/VoxtrSprint0Tests.xcresult
      - build/reports/junit.xml
      - build/reports/xcodebuild-test.log
    publishing:
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: false
          failure: true

  # =======================================================================
  # 5. testflight-release — REAL signing. Nothing in this workflow is a
  #    literal secret: the API key, Team ID, certificate, and profiles are
  #    all fetched at runtime from Codemagic's App Store Connect
  #    integration and environment variable group, referenced here only
  #    by NAME. See README.md → "Codemagic Setup Requirements" for what
  #    you must configure in the Codemagic UI before this workflow can
  #    run — none of it goes in this repo.
  # =======================================================================
  testflight-release:
    name: Vǫxtr — TestFlight release (AthleteApp + ParentApp)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Reference to a Codemagic "App Store Connect" integration, configured
    # under Team settings → Integrations in the Codemagic UI. The actual
    # Issuer ID, Key ID, and .p8 private key live only there — this is a
    # NAME, not a credential.
    integrations:
      app_store_connect: "Vøxtr App Store Connect"

    environment:
      xcode: latest
      # Codemagic environment variable group, configured in the Codemagic
      # UI under this workflow/app's Environment variables. See README.
      groups:
        - voxtr_ios_signing
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        ATHLETE_SCHEME: "AthleteApp"
        PARENT_SCHEME: "ParentApp"
        ATHLETE_BUNDLE_ID: "app.voxtr.athlete"
        PARENT_BUNDLE_ID: "app.voxtr.parent"
      # Automatic code signing through Codemagic: distribution_type +
      # bundle_identifier is enough for Codemagic to resolve the signing
      # identity via the app_store_connect integration above — no manual
      # certificate/profile files anywhere in this repo.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $ATHLETE_BUNDLE_ID

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "release/*"
          include: true

    scripts:
      - name: Fail clearly if required signing configuration is missing
        script: |
          set -e
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID — configure the '${CM_INTEGRATION_NAME:-voxtr_app_store_connect}' App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Missing APP_STORE_CONNECT_KEY_IDENTIFIER — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          echo "App Store Connect signing configuration present — proceeding."

      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies both are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$ATHLETE_SCHEME"
          echo "== Bundle identifiers =="
          echo "AthleteApp: $ATHLETE_BUNDLE_ID"
          echo "ParentApp:  $PARENT_BUNDLE_ID"

      - name: Apply Codemagic project build number via Apple Generic Versioning
        script: |
          set -e
          # PROJECT_BUILD_NUMBER is a Codemagic-provided, project-level
          # build counter that increases across builds — never hardcoded
          # here. Applied once, before either archive: agvtool
          # new-version -all updates CURRENT_PROJECT_VERSION for every
          # target in the project in one call, so the same build number
          # ends up on both AthleteApp and ParentApp — safe because they
          # have separate bundle identifiers and separate App Store
          # Connect records, so this is not a version collision between
          # two different apps, just one shared counter across both.
          : "${PROJECT_BUILD_NUMBER:?Missing PROJECT_BUILD_NUMBER — this is a Codemagic-provided variable and should always be present in a Codemagic build.}"
          echo "Applying build number: $PROJECT_BUILD_NUMBER"
          (cd "$(dirname "$XCODE_PROJECT")" && agvtool new-version -all "$PROJECT_BUILD_NUMBER")
          echo "== Verifying the build number was actually applied =="
          APPLIED_VERSION=$(xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$ATHLETE_SCHEME" \
            | grep -m1 "CURRENT_PROJECT_VERSION" | awk -F'= ' '{print $2}' | tr -d '[:space:]')
          echo "CURRENT_PROJECT_VERSION now resolves to: $APPLIED_VERSION"
          if [ "$APPLIED_VERSION" != "$PROJECT_BUILD_NUMBER" ]; then
            echo "FAILING BUILD: agvtool did not apply the expected build number. This project may not have Apple Generic Versioning (VERSIONING_SYSTEM = apple-generic) configured for every target — see README: Codemagic Setup Requirements."
            exit 1
          fi

      - name: Initialize keychain for code signing
        script: keychain initialize

      - name: Fetch or generate signing files — AthleteApp
        script: |
          app-store-connect fetch-signing-files "$ATHLETE_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain and apply provisioning profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Archive and export AthleteApp (Release)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$ATHLETE_SCHEME" \
            --config Release

      - name: Archive and export ParentApp (Release)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$PARENT_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Publishes every IPA produced above to App Store Connect/TestFlight,
      # authenticating via the same named integration — no key material
      # in this file.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: true
          failure: true

  # =======================================================================
  # 6. testflight-parent — manual only. Builds and publishes ONLY
  #    ParentApp to TestFlight, independently of the release-tag
  #    workflow above — no Git tag required. No `triggering` section at
  #    all: Codemagic still allows starting any workflow manually from
  #    the UI/API regardless of whether it declares automatic triggers
  #    (see `athlete-simulator-build`/`parent-simulator-build` above for
  #    the same pattern) — omitting `triggering` here specifically means
  #    this workflow has no automatic trigger of any kind, so it never
  #    runs from an ordinary push to develop. Same signing approach as
  #    testflight-release: the App Store Connect integration and
  #    environment variable group are referenced by name only — nothing
  #    in this file is a credential.
  # =======================================================================
  testflight-parent:
    name: "Vǫxtr Parent — Manual TestFlight"
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Vøxtr App Store Connect"

    environment:
      xcode: latest
      groups:
        - voxtr_ios_signing
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        PARENT_SCHEME: "ParentApp"
        PARENT_BUNDLE_ID: "app.voxtr.parent"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $PARENT_BUNDLE_ID

    scripts:
      - name: Fail clearly if required signing configuration is missing
        script: |
          set -e
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID — configure the '${CM_INTEGRATION_NAME:-voxtr_app_store_connect}' App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Missing APP_STORE_CONNECT_KEY_IDENTIFIER — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          echo "App Store Connect signing configuration present — proceeding."

      - name: Validate Xcode version, required scheme, and expected bundle identifier
        script: |
          set -e
          mkdir -p build/reports
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Verifying scheme '$PARENT_SCHEME' exists in $XCODE_PROJECT =="
          xcodebuild -list -project "$XCODE_PROJECT" -json > build/reports/schemes.json
          SCHEME_FOUND=$(python3 -c "
          import json
          with open('build/reports/schemes.json') as f:
              data = json.load(f)
          schemes = data.get('project', {}).get('schemes', [])
          print('yes' if '$PARENT_SCHEME' in schemes else 'no')
          ")
          if [ "$SCHEME_FOUND" != "yes" ]; then
            echo "FAILING BUILD: scheme '$PARENT_SCHEME' was not found in $XCODE_PROJECT."
            xcodebuild -list -project "$XCODE_PROJECT"
            exit 1
          fi
          echo "Scheme '$PARENT_SCHEME' found."
          echo "== Verifying expected bundle identifier is present =="
          RESOLVED_BUNDLE_ID=$(xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$PARENT_SCHEME" \
            -destination "generic/platform=iOS" \
            | awk -F' = ' '$1 ~ /^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER$/ { print $2; exit }' \
            | tr -d '[:space:]')
          echo "Resolved bundle identifier: $RESOLVED_BUNDLE_ID"
          if [ "$RESOLVED_BUNDLE_ID" != "$PARENT_BUNDLE_ID" ]; then
            echo "FAILING BUILD: resolved bundle identifier '$RESOLVED_BUNDLE_ID' does not match expected '$PARENT_BUNDLE_ID'."
            exit 1
          fi
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$PARENT_SCHEME"

      - name: Apply Codemagic project build number via Apple Generic Versioning
        script: |
          set -e
          # PROJECT_BUILD_NUMBER is a Codemagic-provided, project-level
          # build counter that increases across builds — never hardcoded
          # here.
          : "${PROJECT_BUILD_NUMBER:?Missing PROJECT_BUILD_NUMBER — this is a Codemagic-provided variable and should always be present in a Codemagic build.}"
          echo "Applying build number: $PROJECT_BUILD_NUMBER"
          (cd "$(dirname "$XCODE_PROJECT")" && agvtool new-version -all "$PROJECT_BUILD_NUMBER")
          echo "== Verifying the build number was actually applied =="
          APPLIED_VERSION=$(xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$PARENT_SCHEME" \
            | grep -m1 "CURRENT_PROJECT_VERSION" | awk -F'= ' '{print $2}' | tr -d '[:space:]')
          echo "CURRENT_PROJECT_VERSION now resolves to: $APPLIED_VERSION"
          if [ "$APPLIED_VERSION" != "$PROJECT_BUILD_NUMBER" ]; then
            echo "FAILING BUILD: agvtool did not apply the expected build number. This project may not have Apple Generic Versioning (VERSIONING_SYSTEM = apple-generic) configured — see README: Codemagic Setup Requirements."
            exit 1
          fi

      - name: Initialize keychain for code signing
        script: keychain initialize

      - name: Add certificates to keychain and apply provisioning profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Archive and export ParentApp (Release)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$PARENT_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: true
          failure: true

  # =======================================================================
  # 7. testflight-athlete — manual only. Same structure as
  #    testflight-parent immediately above, scoped to AthleteApp instead.
  #    See that workflow's own header comment for the shared rationale
  #    (no `triggering` section, same signing approach).
  # =======================================================================
  testflight-athlete:
    name: "Vǫxtr Athlete — Manual TestFlight"
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Vøxtr App Store Connect"

    environment:
      xcode: latest
      groups:
        - voxtr_ios_signing
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        ATHLETE_SCHEME: "AthleteApp"
        ATHLETE_BUNDLE_ID: "app.voxtr.athlete"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $ATHLETE_BUNDLE_ID

    scripts:
      - name: Fail clearly if required signing configuration is missing
        script: |
          set -e
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID — configure the '${CM_INTEGRATION_NAME:-voxtr_app_store_connect}' App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Missing APP_STORE_CONNECT_KEY_IDENTIFIER — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          echo "App Store Connect signing configuration present — proceeding."

      - name: Validate Xcode version, required scheme, and expected bundle identifier
        script: |
          set -e
          mkdir -p build/reports
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Verifying scheme '$ATHLETE_SCHEME' exists in $XCODE_PROJECT =="
          xcodebuild -list -project "$XCODE_PROJECT" -json > build/reports/schemes.json
          SCHEME_FOUND=$(python3 -c "
          import json
          with open('build/reports/schemes.json') as f:
              data = json.load(f)
          schemes = data.get('project', {}).get('schemes', [])
          print('yes' if '$ATHLETE_SCHEME' in schemes else 'no')
          ")
          if [ "$SCHEME_FOUND" != "yes" ]; then
            echo "FAILING BUILD: scheme '$ATHLETE_SCHEME' was not found in $XCODE_PROJECT."
            xcodebuild -list -project "$XCODE_PROJECT"
            exit 1
          fi
          echo "Scheme '$ATHLETE_SCHEME' found."
          echo "== Verifying expected bundle identifier is present =="
          RESOLVED_BUNDLE_ID=$(xcodebuild -showBuildSettings \
            -project "$XCODE_PROJECT" \
            -scheme "$ATHLETE_SCHEME" \
            -destination "generic/platform=iOS" \
            | awk -F' = ' '$1 ~ /^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER$/ { print $2; exit }' \
            | tr -d '[:space:]')
          echo "Resolved bundle identifier: $RESOLVED_BUNDLE_ID"
          if [ "$RESOLVED_BUNDLE_ID" != "$ATHLETE_BUNDLE_ID" ]; then
            echo "FAILING BUILD: resolved bundle identifier '$RESOLVED_BUNDLE_ID' does not match expected '$ATHLETE_BUNDLE_ID'."
            exit 1
          fi
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$ATHLETE_SCHEME"

      - name: Apply Codemagic project build number via Apple Generic Versioning
        script: |
          set -e
          # PROJECT_BUILD_NUMBER is a Codemagic-provided, project-level
          # build counter that increases across builds — never hardcoded
          # here.
          : "${PROJECT_BUILD_NUMBER:?Missing PROJECT_BUILD_NUMBER — this is a Codemagic-provided variable and should always be present in a Codemagic build.}"
          echo "Applying build number: $PROJECT_BUILD_NUMBER"
          (cd "$(dirname "$XCODE_PROJECT")" && agvtool new-version -all "$PROJECT_BUILD_NUMBER")
          echo "== Verifying the build number was actually applied =="
          APPLIED_VERSION=$(xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$ATHLETE_SCHEME" \
            | grep -m1 "CURRENT_PROJECT_VERSION" | awk -F'= ' '{print $2}' | tr -d '[:space:]')
          echo "CURRENT_PROJECT_VERSION now resolves to: $APPLIED_VERSION"
          if [ "$APPLIED_VERSION" != "$PROJECT_BUILD_NUMBER" ]; then
            echo "FAILING BUILD: agvtool did not apply the expected build number. This project may not have Apple Generic Versioning (VERSIONING_SYSTEM = apple-generic) configured — see README: Codemagic Setup Requirements."
            exit 1
          fi

      - name: Initialize keychain for code signing
        script: keychain initialize

      - name: Fetch or generate signing files — AthleteApp
        script: |
          app-store-connect fetch-signing-files "$ATHLETE_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain and apply provisioning profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Archive and export AthleteApp (Release)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$ATHLETE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - cristern@hotmail.com
        notify:
          success: true
          failure: true
