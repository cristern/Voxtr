workflows:

  # =======================================================================
  # 1. package-tests — runs VoxtrSprint0Tests. No signing needed.
  # =======================================================================
  package-tests:
    name: Voxtr — Package unit tests (Swift Testing)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        XCODE_SCHEME: "AthleteApp"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
    scripts:
      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies both are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
          echo "== Bundle identifiers =="
          xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            | grep -i PRODUCT_BUNDLE_IDENTIFIER || true
      - name: Run VoxtrSprint0Tests (unit tests only, no device/signing needed)
        script: |
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -only-testing:VoxtrSprint0Tests \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --report junit || xcodebuild test \
                -project "$XCODE_PROJECT" \
                -scheme "$XCODE_SCHEME" \
                -destination "generic/platform=iOS Simulator" \
                -only-testing:VoxtrSprint0Tests \
                CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/reports/junit.xml
    publishing:
      email:
        recipients: []
        notify:
          success: false
          failure: true

  # =======================================================================
  # 2. athlete-simulator-build — no signing needed.
