  # =======================================================================
  # 4. testflight-release — REAL signing. Nothing in this workflow is a
  #    literal secret: the API key, Team ID, certificate, and profiles are
  #    all fetched at runtime from Codemagic's App Store Connect
  #    integration and environment variable group, referenced here only
  #    by NAME. See README.md → "Codemagic Setup Requirements" for what
  #    you must configure in the Codemagic UI before this workflow can
  #    run — none of it goes in this repo.
  # =======================================================================
  testflight-release:
    name: Vǫxtr — TestFlight release (AthleteApp + ParentApp)
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Reference to a Codemagic "App Store Connect" integration, configured
    # under Team settings → Integrations in the Codemagic UI. The actual
    # Issuer ID, Key ID, and .p8 private key live only there — this is a
    # NAME, not a credential.
    integrations:
      app_store_connect: voxtr_app_store_connect

    environment:
      xcode: latest
      # Codemagic environment variable group, configured in the Codemagic
      # UI under this workflow/app's Environment variables. See README.
      groups:
        - voxtr_ios_signing
      vars:
        XCODE_PROJECT: "App/Voxtr.xcodeproj"
        ATHLETE_SCHEME: "AthleteApp"
        PARENT_SCHEME: "ParentApp"
        ATHLETE_BUNDLE_ID: "app.voxtr.athlete"
        PARENT_BUNDLE_ID: "app.voxtr.parent"
      # Automatic code signing through Codemagic: distribution_type +
      # bundle_identifier is enough for Codemagic to resolve the signing
      # identity via the app_store_connect integration above — no manual
      # certificate/profile files anywhere in this repo.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $ATHLETE_BUNDLE_ID

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "release/*"
          include: true

    scripts:
      - name: Fail clearly if required signing configuration is missing
        script: |
          set -e
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID — configure the '${CM_INTEGRATION_NAME:-voxtr_app_store_connect}' App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Missing APP_STORE_CONNECT_KEY_IDENTIFIER — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY — configure the App Store Connect integration in Codemagic. See README: Codemagic Setup Requirements.}"
          echo "App Store Connect signing configuration present — proceeding."

      - name: Validate project (schemes, packages, Xcode version, bundle IDs)
        script: |
          set -e
          echo "== Xcode version =="
          xcodebuild -version
          echo "== Available schemes (verifies both are shared/discoverable) =="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "== Resolved Swift packages =="
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$ATHLETE_SCHEME"
          echo "== Bundle identifiers =="
          echo "AthleteApp: $ATHLETE_BUNDLE_ID"
          echo "ParentApp:  $PARENT_BUNDLE_ID"

      - name: Initialize keychain for code signing
        script: keychain initialize

      - name: Fetch or generate signing files — AthleteApp
        script: |
          app-store-connect fetch-signing-files "$ATHLETE_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Fetch or generate signing files — ParentApp
        script: |
          app-store-connect fetch-signing-files "$PARENT_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain and apply provisioning profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Archive and export AthleteApp (Release)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$ATHLETE_SCHEME" \
            --config Release

      - name: Archive and export ParentApp (Release)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$PARENT_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Publishes every IPA produced above to App Store Connect/TestFlight,
      # authenticating via the same named integration — no key material
      # in this file.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients: []
        notify:
          success: true
          failure: true
